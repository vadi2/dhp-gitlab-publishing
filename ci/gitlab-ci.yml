# DHP implementation guide build and publish pipeline.
#
# This file lives on the GitLab-only `ci` branch of each mirror project. The
# `ci/` scripts it runs come either from that same branch or, with
# DHP_CI_PROJECT set, from a separate GitLab project, and then the branch holds
# nothing but this file. The `.gitlab-ci.yml` that ships in the GitHub repo
# only does an `include:` of this file, so nothing in the mirrored content has
# to change.
#
# The same file serves both guides unchanged. Everything IG-specific - package
# id, canonical URL, version, title - is read from the checked-out
# sushi-config.yaml by ci/lib/common.sh.
#
# Runner: one shell-executor runner tagged `dhp` with `concurrent = 1`, on a
# host with Java 21, Node + fsh-sushi, Ruby + jekyll, jq, rsync, unzip and zip,
# whose runner user owns $DHP_DATA (see setup-webroot.sh).

variables:
  # Shallow is enough: the scripts read the tag from CI_COMMIT_TAG and the
  # commit from CI_COMMIT_SHA, never from history.
  GIT_DEPTH: "1"
  # Everything the pipeline keeps on the runner host: the web root, the
  # publication workspace, the publisher jar, the terminology seed, the zips.
  # Override as a project CI/CD variable if the host uses another path.
  DHP_DATA: "/srv/dhp"
  # GitLab project holding the scripts, as a path (group/subgroup/project),
  # with them under ci/ at its root - a copy of the dhp-gitlab-publishing
  # repository will do. Jobs fetch it with CI_JOB_TOKEN, so that project has to
  # list both IG projects in its job token allowlist, and the user a pipeline
  # runs as (the mirror user, for mirrored refs) needs read access to it.
  # Empty: the scripts are on the `ci` branch of this project, next to this file.
  DHP_CI_PROJECT: ""
  # Branch or tag of the scripts. Empty means `ci` in this project, or the
  # default branch of DHP_CI_PROJECT. A branch means every job picks up
  # whatever is on its tip at the moment it starts, so a push can change how a
  # release already in the queue behaves. For production, set DHP_CI_REF to a
  # tag (as a project CI/CD variable) and move it deliberately; the sha
  # actually used is echoed below and recorded as DHP_CI_SHA.
  DHP_CI_REF: ""
  # Where the scripts are unpacked inside the job.
  DHP_CI_DIR: "/tmp/dhp-ci"

default:
  tags:
    - dhp
  # A publish must never be cancelled halfway through writing the web root.
  interruptible: false
  before_script:
    - |
      set -eu
      # The scripts are not in what this job checked out. Fetch the one ref
      # that holds them and unpack ci/ somewhere outside the work tree, so the
      # tree stays exactly as the tag or branch has it - which matters, because
      # -go-publish copies the whole source folder.
      if [ -n "${DHP_CI_PROJECT:-}" ]; then
        # GitLab masks CI_JOB_TOKEN in the job log, including inside this URL.
        DHP_CI_REMOTE="${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${DHP_CI_PROJECT}.git"
        DHP_CI_FROM="$DHP_CI_PROJECT"
        DHP_CI_REF="${DHP_CI_REF:-HEAD}"
      else
        DHP_CI_REMOTE=origin
        DHP_CI_FROM="$CI_PROJECT_PATH"
        DHP_CI_REF="${DHP_CI_REF:-ci}"
      fi
      # DHP_CI_REF may name a branch or a tag. Probe with ls-remote rather than
      # trying one fetch and falling back to the other: a fallback has to
      # silence the first fetch's stderr to stay readable, and that hides the
      # real reason a fetch failed behind "couldn't find remote ref". A probe
      # that fails for another reason, such as a job token the scripts project
      # does not allow, surfaces in the fetch below.
      if [ "$DHP_CI_REF" = HEAD ]; then
        DHP_CI_SRC=HEAD
      elif git ls-remote --exit-code --heads "$DHP_CI_REMOTE" "$DHP_CI_REF" >/dev/null 2>&1; then
        DHP_CI_SRC="refs/heads/${DHP_CI_REF}"
      else
        DHP_CI_SRC="refs/tags/${DHP_CI_REF}"
      fi
      git fetch --no-tags --depth=1 "$DHP_CI_REMOTE" "+${DHP_CI_SRC}:refs/remotes/dhp-ci/scripts" || {
        echo "cannot fetch the scripts ($DHP_CI_REF) from $DHP_CI_FROM: check DHP_CI_REF names a branch or tag there," \
             "and for a separate DHP_CI_PROJECT that its job token allowlist has $CI_PROJECT_PATH" \
             "and $GITLAB_USER_LOGIN can read it"
        exit 1
      }
      rm -rf "$DHP_CI_DIR"
      mkdir -p "$DHP_CI_DIR"
      git archive refs/remotes/dhp-ci/scripts ci | tar -x -C "$DHP_CI_DIR"
      chmod +x "$DHP_CI_DIR"/ci/*.sh
      # Which revision of the scripts this job ran, recorded in the build stamp
      # and the publication request so a published folder can be traced back to
      # the pipeline definition that produced it. before_script and script share
      # one shell, so the export reaches the scripts.
      DHP_CI_SHA="$(git rev-parse --short refs/remotes/dhp-ci/scripts)"
      export DHP_CI_SHA
      echo "scripts from $DHP_CI_FROM at $DHP_CI_SHA ($DHP_CI_REF)"
    - |
      # One terminology cache per package id, shared by every job for that IG.
      # No `| head -1` here: head closes the pipe, the upstream stage dies of
      # SIGPIPE and pipefail turns that into a failed job. sed does the job alone.
      # `tr -d '\r'` for the same reason ci/lib/common.sh strips it: a
      # sushi-config.yaml saved with CRLF would otherwise put a carriage return
      # in the middle of a path and mkdir would create a directory nothing finds.
      export TXCACHE_SEED="$DHP_DATA/txcache-seed/$(sed -n '0,/^id:/s/^id:[[:space:]]*//p' sushi-config.yaml | tr -d '\r')"
      mkdir -p "$TXCACHE_SEED"
      export IG_SRC="$CI_PROJECT_DIR"
      echo "IG_SRC=$IG_SRC  DHP_DATA=$DHP_DATA  TXCACHE_SEED=$TXCACHE_SEED"

# Only the default branch and bare semver tags produce a pipeline. Pushing to
# the `ci` branch itself must not create a job-less pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "ci"
      when: never
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - build
  - publish

# Both jobs write the shared web root, so they must never run at the same time.
# The resource group serialises them within one project. It does NOT reach
# across projects - resource groups are project-scoped, so the same name in the
# core and the integrations project is two separate groups. Serialising core
# against integrations is the runner's `concurrent = 1`, nothing else.
#
# The QA report is attached to every job, successful or not. It is attached
# rather than acted on: this pipeline does NOT fail a build or refuse a
# publication over QA errors, because the GitHub repositories already enforce
# their own error and warning limits on every pull request and every release,
# and gating the same thing twice would block a publication for something that
# has already been reviewed upstream. The counts are printed in the job log and
# the report is here. Set FAIL_ON_QA_ERRORS=1 (project variable, or on one
# pipeline) to gate here as well - for a repository without those workflows, or
# for a deliberately strict release.
.writes_web_root:
  resource_group: dhp-webroot
  artifacts:
    when: always
    expire_in: 1 week
    name: "qa-$CI_COMMIT_REF_SLUG"
    paths:
      - output/qa.html
      - output/qa.txt
      - output/qa.json

ci-build:
  extends: .writes_web_root
  stage: build
  timeout: 3h
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - '"$DHP_CI_DIR/ci/ci-build.sh"'

release:
  extends: .writes_web_root
  stage: publish
  # -go-publish rebuilds the guide twice on top of the build the script does
  # itself. Three full builds plus the copying takes well over an hour.
  timeout: 6h
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    # Shell-quoted, not just YAML-quoted: the YAML quotes are stripped before
    # the shell sees the line, so an unquoted $CI_COMMIT_TAG would word-split.
    - '"$DHP_CI_DIR/ci/release.sh" "$CI_COMMIT_TAG"'
