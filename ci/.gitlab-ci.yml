# DHP implementation guide build and publish pipeline - in-repository variant.
#
# Same pipeline as ci/gitlab-ci.yml, for the arrangement where the `ci/`
# directory is committed into the IG repository itself. The jobs then call the
# scripts straight out of the checkout, so there is no `ci` branch to fetch and
# no `ci_config_path` to set on the project.
#
# Use this one once the MOH owns the repositories. Use ci/gitlab-ci.yml while
# they are read-only mirrors of GitHub, where nothing may be added to the
# mirrored content.
#
# The same file serves both guides unchanged. Everything IG-specific - package
# id, canonical URL, version, title - is read from the checked-out
# sushi-config.yaml by ci/lib/common.sh.
#
# Runner requirements (see infra/runner-config/config.toml for a working one):
#   concurrent = 1
#   the publisher image present on the host docker daemon, or pullable
#   volumes:
#     <data>/webroot            -> /web               rw
#     <data>/fhir-package-cache -> /fhir-cache        rw
#     <data>/txcache-seed       -> /txcache-seed-root rw
#     <data>/publisher-cache    -> /publisher-cache   rw
#     <data>/publication        -> /publication       rw   (needs ~12 GB free)
#     <data>/zips               -> /zips              rw
#
# Those paths are the defaults in ci/lib/common.sh, so nothing has to be set
# here. Override any of them with a CI/CD variable if the mounts differ.

variables:
  # Shallow is enough: the scripts read the tag from CI_COMMIT_TAG and the
  # commit from CI_COMMIT_SHA, never from history.
  GIT_DEPTH: "1"

default:
  # Substitute the registry path and runner tag for the MOH installation.
  image: dhp-ig-publisher:local
  tags:
    - dhp
  # A publish must never be cancelled halfway through writing the web root.
  interruptible: false
  before_script:
    - |
      set -eu
      chmod +x ci/*.sh
      # One terminology cache per package id, shared by every job for that IG.
      # No `| head -1` here: head closes the pipe, the upstream stage dies of
      # SIGPIPE and pipefail turns that into a failed job. sed does the job alone.
      # `tr -d '\r'` so a sushi-config.yaml saved with CRLF cannot put a
      # carriage return in the middle of the cache path.
      export TXCACHE_SEED="/txcache-seed-root/$(sed -n '0,/^id:/s/^id:[[:space:]]*//p' sushi-config.yaml | tr -d '\r')"
      mkdir -p "$TXCACHE_SEED"
      export IG_SRC="$CI_PROJECT_DIR"
      export DHP_CI_SHA="${CI_COMMIT_SHORT_SHA:-unknown}"
      echo "IG_SRC=$IG_SRC  TXCACHE_SEED=$TXCACHE_SEED"

# What may start a pipeline at all. Without this block GitLab creates one for
# every branch push, and these repositories are mirrors carrying 40+ branches
# each: one mirror sync then queues days of 15-90 minute builds ahead of a
# release tag on a `concurrent = 1` runner. It also produced the classic
# duplicate merge-request pipeline, because the build job's rules matched both
# `merge_request_event` and the branch push behind it.
#
# So: the default branch, bare semver tags, and merge requests. A side branch
# with no merge request builds nothing - open the merge request to get a build.
# Add `- if: $CI_COMMIT_BRANCH =~ /^release-/` or similar here if some other
# branch should build, rather than reinstating the bare `$CI_COMMIT_BRANCH`
# rule in the job.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: never

# Only the default branch and bare semver tags publish anything; merge requests
# get the build-only job below.
stages:
  - build
  - publish

# Both publishing jobs write the shared web root, so they must never run at the
# same time. The resource group serialises them within one project. It does NOT
# reach across projects - resource groups are project-scoped, so the same name
# in the core and the integrations project is two separate groups. Serialising
# core against integrations is the runner's `concurrent = 1`, nothing else.
#
# The QA report is attached to every job, successful or not. It is attached
# rather than acted on: this pipeline does NOT fail a build or refuse a
# publication over QA errors, because the repository's own workflows already
# enforce error and warning limits on every pull request and every release, and
# gating the same thing twice would block a publication for something that has
# already been reviewed. The counts are printed in the job log and the report is
# here. Set FAIL_ON_QA_ERRORS=1 (project variable, or on one pipeline) to gate
# here as well - for a fork without those workflows, or a strict release.
.writes_web_root:
  resource_group: dhp-webroot
  artifacts:
    when: always
    expire_in: 1 week
    name: "qa-$CI_COMMIT_REF_SLUG"
    paths:
      - output/qa.html
      - output/qa.txt
      - output/qa.json

# Fast feedback on merge requests: build only, touch nothing shared.
# SKIP_DEPLOY stops ci-build.sh before it copies into the web root, so this job
# needs neither the resource group nor a writable /web - and the mount check in
# common.sh is skipped for it for the same reason.
build:
  stage: build
  timeout: 3h
  variables:
    SKIP_DEPLOY: "1"
  script:
    - '"$CI_PROJECT_DIR/ci/ci-build.sh"'
  artifacts:
    when: always
    expire_in: 1 week
    name: "qa-$CI_COMMIT_REF_SLUG"
    paths:
      - output/qa.html
      - output/qa.txt
      - output/qa.json
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Continuous build of the default branch, deployed to
# https://dhp.uz/fhir/<ig>/ci-build/
ci-build:
  extends: .writes_web_root
  stage: build
  timeout: 3h
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - '"$CI_PROJECT_DIR/ci/ci-build.sh"'

release:
  extends: .writes_web_root
  stage: publish
  # -go-publish rebuilds the guide twice on top of the build the script does
  # itself. Three full builds plus the copying takes well over an hour.
  timeout: 6h
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - '"$CI_PROJECT_DIR/ci/release.sh" "$CI_COMMIT_TAG"'

